services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myvpn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myvpn_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-myvpn}
    volumes:
      - myvpn_pgdata:/var/lib/postgresql/data
    # Bound to localhost only for local development tooling (ef / integration).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myvpn} -d ${POSTGRES_DB:-myvpn}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - myvpn

  backend:
    build:
      context: .
      dockerfile: backend/MyVPN.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      ConnectionStrings__Default: ${ConnectionStrings__Default:-Host=postgres;Port=5432;Database=myvpn;Username=myvpn;Password=myvpn_dev_password}
      Jwt__Issuer: ${Jwt__Issuer:-myvpn-api}
      Jwt__Audience: ${Jwt__Audience:-myvpn-clients}
      Jwt__SigningKey: ${Jwt__SigningKey:-DEV_ONLY_CHANGE_ME_32chars_min_key!!}
      Jwt__AccessTokenLifetimeMinutes: ${Jwt__AccessTokenLifetimeMinutes:-15}
      RefreshTokens__LifetimeDays: ${RefreshTokens__LifetimeDays:-30}
      RefreshTokens__HashPepper: ${RefreshTokens__HashPepper:-DEV_ONLY_REFRESH_PEPPER_CHANGE_ME_32}
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - myvpn

volumes:
  myvpn_pgdata:

networks:
  myvpn:
    driver: bridge
